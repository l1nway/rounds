name: Router to Cloudflare

on:
  push:
    branches: [main]
    paths: [router/**, .github/workflows/router.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: router
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Require the Cloudflare token
        run: test -n "$CLOUDFLARE_API_TOKEN" -a -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: router
          wranglerVersion: 4.151.2
